<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="SIFintel mark C">
  <defs>
    <linearGradient id="br" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#4361ff"/><stop offset="0.5" stop-color="#a855f7"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- bright gradient tile -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#br)"/>
  <!-- bold upward arrow = strength / momentum -->
  <g filter="url(#glow)" fill="#ffffff">
    <path d="M32 12 L50 32 L41 32 L41 50 L23 50 L23 32 L14 32 Z"/>
  </g>
  <!-- spark = intelligence -->
  <path d="M47 15 l1.3 3.3 3.3 1.3 -3.3 1.3 -1.3 3.3 -1.3 -3.3 -3.3 -1.3 3.3 -1.3 Z" fill="#ffffff"/>
</svg>
