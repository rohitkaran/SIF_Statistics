<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="SIFintel">
  <defs>
    <linearGradient id="br" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#4361ff"/><stop offset="0.5" stop-color="#a855f7"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)" fill="none" stroke="url(#br)" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- rising trend -->
    <path d="M8 50 L24 40 L34 44 L52 20"/>
    <!-- up-right arrowhead -->
    <path d="M39 20 L52 20 L52 33"/>
  </g>
</svg>
