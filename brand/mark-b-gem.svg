<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="SIFintel mark B">
  <defs>
    <linearGradient id="br" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#4361ff"/><stop offset="0.5" stop-color="#a855f7"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161d33"/><stop offset="1" stop-color="#0a0e18"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#tile)" stroke="url(#br)" stroke-opacity="0.4"/>
  <!-- faceted upward crystal = strength (hard apex) + intelligence (clarity) -->
  <g filter="url(#glow)">
    <path d="M32 9 L49 27 L32 55 L15 27 Z" fill="url(#br)"/>
    <path d="M32 9 L15 27 L32 27 Z" fill="#ffffff" fill-opacity="0.22"/>
    <path d="M32 9 L49 27 L32 27 Z" fill="#ffffff" fill-opacity="0.10"/>
    <path d="M15 27 L49 27 L32 55 Z" fill="#000000" fill-opacity="0.12"/>
    <path d="M32 9 L32 55 M15 27 L49 27" stroke="#eafcff" stroke-opacity="0.5" stroke-width="1"/>
  </g>
  <!-- tiny spark glint -->
  <path d="M40 15 l1 2.6 2.6 1 -2.6 1 -1 2.6 -1 -2.6 -2.6 -1 2.6 -1 Z" fill="#eafcff"/>
</svg>
