<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1014"/><stop offset="1" stop-color="#141a21"/>
    </linearGradient>
    <linearGradient id="sfi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b8bff"/><stop offset="0.55" stop-color="#a97bff"/><stop offset="1" stop-color="#3fd0c9"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- top gradient accent bar -->
  <rect x="0" y="0" width="1200" height="8" fill="url(#sfi)"/>
  <!-- faint long/short chart motif -->
  <path d="M0 470 L150 440 L250 500 L370 420 L500 460 L640 360 L780 400 L920 300 L1060 340 L1200 250"
        fill="none" stroke="url(#sfi)" stroke-width="3" stroke-opacity="0.25"/>
  <!-- mark: ascending bars (strength) + spark (intelligence), bright on dark -->
  <g transform="translate(90,120) scale(2.0625)">
    <rect x="0" y="0" width="64" height="64" rx="16" fill="#0f1524" stroke="url(#sfi)" stroke-opacity="0.5" stroke-width="1.4"/>
    <g fill="url(#sfi)">
      <rect x="15" y="35" width="8.5" height="14" rx="3"/>
      <rect x="27.75" y="28" width="8.5" height="21" rx="3"/>
      <rect x="40.5" y="20" width="8.5" height="29" rx="3"/>
    </g>
    <path d="M44.75 8 L46.6 12.9 L51.5 14.75 L46.6 16.6 L44.75 21.5 L42.9 16.6 L38 14.75 L42.9 12.9 Z" fill="#eafcff"/>
  </g>
  <!-- wordmark -->
  <text x="252" y="215" font-family="Inter, system-ui, sans-serif" font-size="104" font-weight="800" letter-spacing="-2">
    <tspan fill="#eef3f9">SIF</tspan><tspan fill="url(#sfi)">intel</tspan>
  </text>
  <text x="92" y="330" font-family="Inter, system-ui, sans-serif" font-size="40" font-weight="600" fill="#dbe3ec">Intelligence on India's Specialized Investment Funds</text>
  <text x="92" y="392" font-family="Inter, system-ui, sans-serif" font-size="27" font-weight="400" fill="#8b97a6">Real NAVs · disclosed holdings · risk/return · up/down capture · fund comparison</text>
  <text x="92" y="560" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="24" font-weight="500" fill="#3fd0c9">sifintel.com</text>
  <text x="92" y="596" font-family="Inter, system-ui, sans-serif" font-size="18" fill="#5c6675">Decode the strategy behind the returns.</text>
</svg>
