  </g>
  <!-- wordmark -->
  <text x="252" y="215" font-family="Inter, system-ui, sans-serif" font-size="104" font-weight="800" letter-spacing="-2">
    <tspan fill="#eef3f9">SIF</tspan><tspan fill="url(#sfi)">intel</tspan>
  </text>
  <text x="92" y="330" font-family="Inter, system-ui, sans-serif" font-size="40" font-weight="600" fill="#dbe3ec">Intelligence on India's Specialized Investment Funds</text>
