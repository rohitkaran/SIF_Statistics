<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="SIFintel mark A">
  <defs>
    <linearGradient id="br" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#4361ff"/><stop offset="0.5" stop-color="#a855f7"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161d33"/><stop offset="1" stop-color="#0a0e18"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#tile)" stroke="url(#br)" stroke-opacity="0.4"/>
  <!-- ascending bars = strength / growth -->
  <g filter="url(#glow)" fill="url(#br)">
    <rect x="15" y="35" width="8.5" height="14" rx="3"/>
    <rect x="27.75" y="28" width="8.5" height="21" rx="3"/>
    <rect x="40.5" y="20" width="8.5" height="29" rx="3"/>
  </g>
  <!-- spark = intelligence / insight -->
  <g filter="url(#glow)">
    <path d="M44.75 8 L46.6 12.9 L51.5 14.75 L46.6 16.6 L44.75 21.5 L42.9 16.6 L38 14.75 L42.9 12.9 Z" fill="#eafcff"/>
  </g>
</svg>
