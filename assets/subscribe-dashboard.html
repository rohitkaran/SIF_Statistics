<style>
  .subwrap{border-top:1px solid var(--line);background:var(--foot)}
  .subinner{max-width:1100px;margin:0 auto;padding:24px 16px;display:flex;gap:26px;
    flex-wrap:wrap;align-items:center;justify-content:space-between;font-family:var(--sans)}
  .subcopy{flex:1 1 330px;min-width:0}
  .subcopy h4{margin:0 0 5px;font-size:15px;color:var(--ink)}
  .subcopy p{margin:0;font-size:13px;color:var(--ink-dim);max-width:62ch;line-height:1.55}
  .subform{flex:0 1 370px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;position:relative}
  .subform input[type=email]{flex:1 1 190px;min-width:0;padding:9px 11px;border:1px solid var(--line2);
    border-radius:8px;background:var(--panel);color:var(--ink);font:inherit;font-size:13px}
  .subform button{flex:0 0 auto;background:#5b5bf0;color:#fff;border:0;padding:9px 17px;
    border-radius:8px;cursor:pointer;font:inherit;font-weight:600;font-size:13px}
  .subform button:disabled{opacity:.6;cursor:default}
  .substatus{flex:1 1 100%;margin:2px 0 0;font-size:12.5px;color:var(--ink-dim);min-height:1.2em}
  .substatus.good{color:#4bd28a} .substatus.warn{color:#e7b84b}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  @media (max-width:640px){.subform{flex:1 1 100%}}
</style>
<section class="subwrap" id="subscribe">
  <div class="subinner">
    <div class="subcopy">
      <h4>The week in Indian SIFs</h4>
      <p>One email a week: new launches and NFOs, fresh portfolio disclosures, AUM and flows,
      and how the category performed. Free, one-click unsubscribe.</p>
    </div>
    <form class="subform" id="subform" novalidate>
      <label class="sr" for="subemail">Your email</label>
      <input id="subemail" name="email" type="email" inputmode="email" autocomplete="email"
             placeholder="you@example.com" required>
      <div style="position:absolute;left:-5000px" aria-hidden="true">
        <input name="company" tabindex="-1" autocomplete="off"></div>
      <button type="submit">Subscribe</button>
      <p class="substatus" id="substatus" role="status" aria-live="polite"></p>
    </form>
  </div>
</section>
<script>
(function(){
  var f=document.getElementById('subform'); if(!f) return;
  var s=document.getElementById('substatus');
  f.addEventListener('submit', async function(e){
    e.preventDefault();
    var btn=f.querySelector('button[type=submit]');
    var email=(f.email.value||'').trim();
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){
      s.className='substatus warn'; s.textContent='Please enter a valid email address.'; return; }
    btn.disabled=true; s.className='substatus'; s.textContent='Sending…';
    try{
      var r=await fetch('/api/subscribe',{method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({email:email,company:f.company.value})});
      var j=await r.json().catch(function(){return {};});
      if(r.ok&&j.ok){ s.className='substatus good';
        s.textContent='Check your inbox — click the link to confirm.'; f.reset(); }
      else { s.className='substatus warn';
        s.textContent=(j&&j.error)||'Could not subscribe. Please try again.'; }
    }catch(err){ s.className='substatus warn'; s.textContent='Network error. Please try again.'; }
    btn.disabled=false;
  });
})();
</script>
