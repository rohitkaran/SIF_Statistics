<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{                              /* lively LIGHT theme (default) */
    --bg:#eef1fb; --panel:#ffffff; --panel2:#f5f7fd; --line:#e5e9f4; --line2:#d3daec;
    --ink:#1c2338; --ink-dim:#5a6485; --ink-faint:#9aa2bd;
    --accent:#5b5bf0; --accent2:#0e9aa7;
    --pos:#12a150; --neg:#e5484d; --amber:#d9820b;
    --hl:#eef1ff; --myfund:#e7e6ff;
    --thead:#e7ebf8; --grp:#eef1fb; --rowhover:#f0f3fd; --foot:#f2f5fc;
    --grad1:#4361ff; --grad2:#a855f7; --grad3:#22d3ee;
    --mono:'IBM Plex Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;
    --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  :root[data-theme="dark"]{           /* midnight theme (toggle) */
    --bg:#0d1014; --panel:#141a21; --panel2:#0f141a; --line:#2a3542; --line2:#3a4a5c;
    --ink:#eef3f9; --ink-dim:#aab6c6; --ink-faint:#7c8798;
    --accent:#9a9aff; --accent2:#4fe0d8;
    --pos:#5fdf9a; --neg:#ff7d90; --amber:#f0c65e;
    --hl:#1c2836; --myfund:#26384d;
    --thead:#0f151c; --grp:#0b0f14; --rowhover:#12181f; --foot:#0b1015;
    --grad1:#5f7bff; --grad2:#b45cff; --grad3:#2ee6ff;
  }
  :root[data-theme="dark"] .num{color:var(--ink)}      /* keep figures bright on dark */
  :root[data-theme="dark"] tr.low td{opacity:.62}      /* greyed rows stay legible */
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
    font-size:13px;line-height:1.4;-webkit-font-smoothing:antialiased}
  body{padding-bottom:60px}
  a{color:var(--accent2)}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums lining-nums;font-feature-settings:"tnum" 1,"lnum" 1}
  h1.wm{font-size:29px;font-weight:800;letter-spacing:-0.6px;margin:0;line-height:1.03;
    text-transform:none;white-space:nowrap;color:#1c3f77;font-family:var(--sans)}
  .wm .wm-in{position:relative;color:#17a67a}
  .wm-star{position:absolute;left:-0.10em;top:-0.44em;width:0.5em;height:0.5em;fill:#17a67a}
  :root[data-theme="dark"] h1.wm{color:#e6edf5}
  :root[data-theme="dark"] .wm .wm-in{color:#33d69f}
  :root[data-theme="dark"] .wm-star{fill:#33d69f}
  .sub{color:var(--ink-dim);font-size:11px}

  /* ---- control bar ---- */
  header{position:sticky;top:0;z-index:40;background:var(--panel);
    border-top:3px solid transparent;border-image:linear-gradient(90deg,var(--grad1),var(--grad2),var(--grad3)) 1;
    border-bottom:1px solid var(--line2);padding:8px 12px}
  .topstrip{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:-2px 0 7px;
    font-family:var(--mono);font-size:11px;color:var(--ink-dim);white-space:nowrap}
  .topstrip .live{display:inline-flex;align-items:center;gap:6px;color:var(--ink);font-variant-numeric:tabular-nums}
  .livedot{width:7px;height:7px;border-radius:50%;background:var(--pos);flex:none;
    box-shadow:0 0 0 0 rgba(18,161,80,.5);animation:livepulse 2s infinite}
  @keyframes livepulse{0%{box-shadow:0 0 0 0 rgba(18,161,80,.5)}70%{box-shadow:0 0 0 7px rgba(18,161,80,0)}100%{box-shadow:0 0 0 0 rgba(18,161,80,0)}}
  .navtill{color:var(--ink-dim);overflow:hidden;text-overflow:ellipsis} .navtill b{color:var(--ink)}
  .bar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end}
  .brand{display:flex;flex-direction:row;align-items:center;gap:10px;margin-right:6px}
  .blogo{flex:none}
  .btext{display:flex;flex-direction:column;gap:1px;min-width:0}
  .fld{display:flex;flex-direction:column;gap:3px}
  .fld label{font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint)}
  .fld input,.fld select{background:var(--panel2);border:1px solid var(--line2);color:var(--ink);
    border-radius:5px;padding:4px 6px;font-size:12px;font-family:var(--mono);transition:border-color .12s}
  .fld input:hover,.fld select:hover{border-color:var(--line2)}
  .fld input:focus,.fld select:focus{border-color:var(--accent)}
  .fld input[type=date]{min-width:126px}
  .fld input.small{width:58px}
  .fld input.rx{width:120px;font-family:var(--mono)}
  button{background:var(--panel2);border:1px solid var(--line2);color:var(--ink);
    border-radius:6px;padding:5px 11px;font-size:12px;font-weight:600;cursor:pointer;font-family:var(--sans);transition:all .12s}
  button:hover{border-color:var(--accent);color:#fff;background:var(--accent)}
  button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
  button.pri:hover{filter:brightness(1.08)}
  button.ghost{background:transparent}
  :focus-visible{outline:2px solid var(--accent);outline-offset:1px}

  .status{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:7px;
    font-size:11px;color:var(--ink-dim)}
  .status b{color:var(--ink);font-weight:600}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--pos);display:inline-block;margin-right:5px}
  .dot.err{background:var(--neg)} .dot.warn{background:var(--amber)}
  .flags{color:var(--amber)}

  /* ---- drop zone ---- */
  #drop{position:fixed;inset:0;z-index:80;background:rgba(8,12,16,.86);display:none;
    align-items:center;justify-content:center;text-align:center}
  #drop.on{display:flex}
  #drop .box{border:2px dashed var(--accent);border-radius:8px;padding:40px 60px;font-size:15px}
  .nm input.cmp{margin:0 5px 0 0;vertical-align:middle;cursor:pointer;accent-color:var(--accent)}

  /* ---- compare modal ---- */
  #cmp{position:fixed;inset:0;z-index:90;background:rgba(8,12,16,.72);display:none;
    align-items:center;justify-content:center;padding:18px}
  #cmp.on{display:flex}
  .cmp-in{background:var(--panel);border:1px solid var(--line2);border-radius:8px;max-width:1000px;
    width:100%;max-height:92vh;overflow:auto;padding:14px 16px;box-shadow:0 16px 50px rgba(0,0,0,.4)}
  .cmp-hd{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .cmp-legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:11.5px;margin:8px 0}
  .cmp-legend .lg{display:flex;align-items:center;gap:5px}
  .cmp-legend .sw2{width:14px;height:3px;border-radius:2px;display:inline-block}
  .cmpt-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:8px;border:1px solid var(--line);border-radius:8px}
  .cmp-note{margin:2px 0 8px}
  table.cmpt{border-collapse:collapse;width:100%;font-size:11.5px}
  table.cmpt th,table.cmpt td{border-bottom:1px solid var(--line);padding:6px 10px;white-space:nowrap;text-align:right}
  table.cmpt th{color:var(--ink-dim);font-weight:600;text-transform:uppercase;font-size:9.5px;letter-spacing:.04em;
    position:sticky;top:0;background:var(--thead);z-index:1}
  table.cmpt td:first-child,table.cmpt th:first-child{text-align:left;max-width:230px;overflow:hidden;text-overflow:ellipsis;
    position:sticky;left:0;background:var(--panel);z-index:2;box-shadow:1px 0 0 var(--line2)}
  table.cmpt th:first-child{z-index:3;background:var(--thead)}
  table.cmpt tbody tr:hover td{background:var(--rowhover)}
  .cmp-empty{color:var(--ink-dim);font-size:12.5px;padding:16px 4px}
  /* floating "Compare (n)" button when funds are ticked */
  #cmpFloat{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:70;
    background:var(--accent);color:#fff;border:none;border-radius:24px;padding:11px 20px;font-weight:700;
    font-size:13px;box-shadow:0 8px 24px rgba(91,91,240,.45);cursor:pointer}
  #cmpFloat.on{display:inline-flex;align-items:center;gap:7px}

  /* ---- table ---- */
  .wrap{overflow-x:auto}
  table{border-collapse:separate;border-spacing:0;width:100%;min-width:1080px}
  thead th{position:sticky;top:0;z-index:20;background:var(--thead);border-bottom:1px solid var(--line2);
    padding:6px 8px;font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-dim);
    white-space:nowrap;cursor:pointer;user-select:none;font-weight:600}
  thead th.r{text-align:right}
  thead th:hover{color:var(--ink)}
  thead th .ar{color:var(--accent);font-size:9px;margin-left:2px}
  thead th .qh{color:var(--ink-faint);font-size:8.5px;margin-left:2px;vertical-align:top;cursor:help}
  thead th:hover .qh{color:var(--accent2)}
  td{padding:4px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
  td.r{text-align:right}
  tbody tr:hover td{background:var(--rowhover)}
  /* pin the scheme-name column at ALL widths so the metrics scroll under it */
  thead th:first-child{position:sticky;left:0;z-index:28;background:var(--thead);box-shadow:1px 0 0 var(--line2)}
  tbody td:first-child{position:sticky;left:0;z-index:15;background:var(--panel);box-shadow:1px 0 0 var(--line2)}
  tbody tr:hover td:first-child{background:var(--rowhover)}
  tr.myfund td:first-child{background:var(--myfund)}
  tr.grp td{background:var(--grp);border-bottom:1px solid var(--line2);border-top:1px solid var(--line2);
    padding:5px 8px;position:static;box-shadow:none}
  .grp .gt{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:700}
  .grp .gc{color:var(--ink-faint);font-weight:500;letter-spacing:0;text-transform:none}
  tr.low td{opacity:.45}
  tr.myfund td{box-shadow:inset 2px 0 0 var(--accent)}
  tr.myfund td:first-child{background:var(--myfund)}
  .nm{max-width:340px;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
  .nm .plan{color:var(--ink-faint);font-size:10.5px}
  .nm .amc{color:var(--ink);font-weight:600}
  .nm .parent{color:var(--ink-dim);font-size:11px}
  .nm .pbadge{color:var(--accent2);font-size:10px}
  .caret{display:inline-block;width:9px;color:var(--ink-faint);transition:transform .12s}
  tr.open .caret{transform:rotate(90deg);color:var(--accent)}
  .rng{color:var(--ink-dim);font-size:11px}
  .spark{display:block}
  .flag{color:var(--amber);font-weight:700;margin-left:3px}
  .na{color:var(--ink-faint)}
  .expand td{background:var(--grp);padding:0}
  .exp-in{padding:12px 16px;display:grid;grid-template-columns:1fr 1fr;gap:20px}
  .exp-meta{grid-column:1/3;display:flex;flex-wrap:wrap;gap:14px 26px;font-size:11.5px;color:var(--ink-dim)}
  .exp-meta b{color:var(--ink);font-weight:600}
  .chart h4{margin:0 0 4px;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-dim)}
  @media (max-width:720px){ .exp-in{grid-template-columns:1fr} .exp-meta{grid-column:1} }

  /* ---- portfolio (disclosed holdings) ---- */
  .port{grid-column:1/3;border-top:1px dashed var(--line2);padding-top:10px;margin-top:2px}
  .port .phead{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-bottom:8px;font-size:11.5px;color:var(--ink-dim)}
  .port .phead b{color:var(--ink)}
  .port select{background:var(--panel2);border:1px solid var(--line2);color:var(--ink);border-radius:3px;padding:2px 5px;font-size:11.5px;font-family:var(--mono)}
  .port .none{color:var(--ink-faint);font-size:11.5px;padding:4px 0}
  .port .pstrat{display:flex;flex-direction:column;gap:3px;margin:2px 0 9px;font-size:11.5px;color:var(--ink-dim);max-width:900px}
  .port .pstrat b{color:var(--ink)} .port .pstrat .mgr{color:var(--ink-dim)}
  .port .pgrid{display:grid;grid-template-columns:1.35fr 1fr;gap:16px 22px;align-items:start}
  @media (max-width:720px){ .port .pgrid{grid-template-columns:1fr} }
  .port h5{margin:0 0 5px;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-dim)}
  .allocbar{display:flex;height:16px;border-radius:3px;overflow:hidden;border:1px solid var(--line2);margin-bottom:4px}
  .allocbar span{display:block}
  .alloclegend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:10.5px;color:var(--ink-dim)}
  .alloclegend i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:4px;vertical-align:-1px}
  .ls{display:flex;gap:14px;font-size:11.5px;margin:6px 0 2px}
  .ls b{font-family:var(--mono)}
  table.hold{min-width:0;width:100%;border-collapse:collapse}
  table.hold td{border-bottom:1px solid var(--line);padding:2px 6px;white-space:nowrap}
  table.hold td.w{text-align:right;position:relative}
  table.hold .bar{position:absolute;right:0;top:0;bottom:0;background:var(--accent);opacity:.14;border-radius:2px}
  table.hold td.nm2{max-width:230px;overflow:hidden;text-overflow:ellipsis}
  table.hold .sec{color:var(--ink-faint);font-size:10px}
  .short td.w .bar{background:var(--neg)}

  footer{position:fixed;bottom:0;left:0;right:0;background:var(--foot);border-top:1px solid var(--line2);
    padding:5px 12px;font-size:10.5px;color:var(--ink-faint);z-index:30;display:flex;gap:16px;flex-wrap:wrap}
  .legend{display:flex;gap:8px;align-items:center}
  .sw{width:11px;height:11px;border-radius:2px;display:inline-block}

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}

  .hidden-col{display:none}          /* columns hidden via the Columns picker (any viewport) */

  /* column picker */
  .mobtoggle{display:none}
  .colpick{position:relative}
  .colpick>summary{list-style:none;cursor:pointer;background:var(--panel2);border:1px solid var(--line2);
    color:var(--ink);border-radius:5px;padding:4px 8px;font-size:12px;font-family:var(--mono);white-space:nowrap}
  .colpick>summary::-webkit-details-marker{display:none}
  .colpick[open]>summary{border-color:var(--accent)}
  .colpick-menu{position:absolute;z-index:60;top:calc(100% + 4px);left:0;min-width:200px;max-height:60vh;overflow:auto;
    background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:6px;box-shadow:0 14px 34px rgba(0,0,0,.28)}
  .colpick-menu .copt{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:5px;font-size:12.5px;cursor:pointer;color:var(--ink)}
  .colpick-menu .copt:hover{background:var(--rowhover)}
  .colpick-menu .copt input{accent-color:var(--accent);width:15px;height:15px}
  .colpick-menu .cprow{display:flex;gap:6px;padding:3px 4px 6px;border-bottom:1px solid var(--line);margin-bottom:4px}
  .colpick-menu .cprow button{flex:1;padding:4px;font-size:11px}

  /* ---- mobile: compact COMPARISON table (funds = rows, chosen metrics = columns) ---- */
  .wrap{-webkit-overflow-scrolling:touch}
  @media (max-width:820px){
    html,body{font-size:12.5px}
    body{padding-bottom:16px}
    /* header scrolls away so the table owns the screen; filters collapse behind a toggle */
    header{position:static;padding:9px 11px}
    .bar{gap:9px 10px;align-items:center}
    .brand{flex:1 1 calc(100% - 116px);min-width:0;margin:0}
    h1{font-size:14px} .brand .sub{font-size:10.5px}
    .mobtoggle{display:inline-flex;align-items:center;gap:5px;background:var(--panel2);
      border:1px solid var(--line2);color:var(--ink);border-radius:9px;padding:9px 15px;font-weight:600;font-size:13px;align-self:center}
    header.collapsed .fld,header.collapsed .status{display:none}
    header:not(.collapsed){box-shadow:0 14px 30px rgba(0,0,0,.22)}
    .fld{flex:1 1 44%} .fld label{font-size:10px}
    .fld input,.fld select,.colpick>summary{width:100%;padding:10px 11px;font-size:14px;border-radius:8px}
    .fld input.small,.fld input.rx{width:100%}
    header:not(.collapsed) button{border-radius:8px;padding:10px 13px}

    /* fit-to-screen comparison table: fund column pinned, chosen metrics share the rest.
       Auto layout (NOT table-layout:fixed) so display:none columns are dropped cleanly. */
    .wrap{overflow-x:auto}
    table{min-width:0;width:100%}
    thead th{top:0;padding:7px 5px;font-size:9px;text-align:right}
    thead th .qh{display:none}
    td{padding:10px 6px;font-size:12.5px}
    td .num,.num{font-size:12.5px}
    tr.grp td{padding:7px 8px}
    .nm{max-width:44vw;white-space:normal;line-height:1.3}
    .nm .amc{font-size:12.5px} .nm .parent{display:block;font-size:10px;margin-left:16px} .nm .plan{display:none}
    .nm input.cmp{width:17px;height:17px}
    thead th:first-child,tbody td:first-child{box-shadow:2px 0 7px -3px rgba(0,0,0,.3)}
    .exp-in{grid-template-columns:1fr;padding:12px;gap:16px}
    .port .pgrid{grid-template-columns:1fr}
    footer{position:static;padding:9px 12px;font-size:10.5px}
    .cmp-in{padding:12px;border-radius:14px} table.cmpt{font-size:10.5px}
    .colpick-menu{min-width:180px}
  }
</style>

<header>
  <div class="topstrip">
    <span id="liveclock" class="live"><span class="livedot"></span> Live · —</span>
    <span id="navtill" class="navtill"></span>
  </div>
  <div class="bar">
    <div class="brand">
      <div class="btext">
        <h1 class="wm">SIF<span class="wm-in">intel<svg class="wm-star" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.5 L14.3 9.7 L22.5 12 L14.3 14.3 L12 22.5 L9.7 14.3 L1.5 12 L9.7 9.7 Z"/></svg></span></h1>
        <span class="sub">Specialised Investment Fund Intelligence</span>
      </div>
    </div>
    <button id="filtToggle" class="mobtoggle" aria-expanded="false">☰ Filters</button>
    <div class="fld"><label>From</label><input type="date" id="from"></div>
    <div class="fld"><label>To</label><input type="date" id="to"></div>
    <div class="fld"><label>Risk-free %</label><input class="small num" id="rf" value="6.5"></div>
    <div class="fld"><label>Trading days</label><input class="small num" id="days" value="252"></div>
    <div class="fld"><label>Min obs</label><input class="small num" id="minobs" value="10"></div>
    <div class="fld"><label>Recovery</label><select id="recmode">
      <option value="trading">Trading days</option><option value="calendar">Calendar days</option>
    </select></div>
    <div class="fld"><label>Strategy</label><select id="strat">
      <option value="all">All strategies</option>
      <option value="hls">Hybrid Long-Short</option>
      <option value="els">Equity Long-Short</option>
      <option value="smid">Ex-Top 100 SMID</option>
      <option value="sr">Sector Rotation</option>
      <option value="alloc">Allocator</option>
      <option value="other">Other</option>
    </select></div>
    <div class="fld"><label>Plan</label><select id="plan">
      <option value="all">All plans</option>
      <option value="direct" selected>Direct only</option>
      <option value="regular">Regular only</option>
    </select></div>
    <div class="fld"><label>Option</label><select id="opt">
      <option value="all">All options</option>
      <option value="growth" selected>Growth only</option>
      <option value="idcw">IDCW / Dividend</option>
    </select></div>
    <div class="fld"><label>My funds (regex)</label><input class="rx" id="myrx" value="apex"></div>
    <div class="fld"><label>Search</label><input class="rx" id="search" placeholder="name…"></div>
    <div class="fld"><label>Columns to compare</label>
      <details class="colpick"><summary id="colsum">Choose columns ▾</summary>

<script>
// ==METRICS-START==  (this exact block is unit-tested via node in verification)
const SIFMetrics = (function(){
  function daysBetween(a,b){
    // a,b : 'YYYY-MM-DD'
    const pa=a.split('-').map(Number), pb=b.split('-').map(Number);
    const da=Date.UTC(pa[0],pa[1]-1,pa[2]), db=Date.UTC(pb[0],pb[1]-1,pb[2]);
    return Math.round((db-da)/86400000);
  }
  // filter a full [ [iso,nav], ... ] series to the inclusive window [from,to]
  function windowSeries(series, from, to){
    const out=[];
    for(const p of series){
      if((!from || p[0]>=from) && (!to || p[0]<=to)) out.push(p);
    }
    return out;
  }
  // series: sorted ascending [ [iso,nav], ... ] already windowed
  // opts: {D, Rf, recoveryMode:'trading'|'calendar'}
  function compute(series, opts){
    const D = opts.D, Rf = opts.Rf, recMode = opts.recoveryMode || 'trading';
    const dates = series.map(p=>p[0]);
    const navs  = series.map(p=>Number(p[1]));
    const obs = navs.length;
    const base = {obs, nret: Math.max(0, obs-1),
                  rangeFrom: dates[0]||null, rangeTo: dates[obs-1]||null};
    if(obs < 2) return Object.assign(base, {insufficient:true, underwater:[], navs, dates});

    // daily returns
    const r = [];
    for(let i=1;i<obs;i++) r.push(navs[i]/navs[i-1]-1);
    const n = r.length;
    const mean = r.reduce((a,b)=>a+b,0)/n;
    let ss=0; for(const x of r) ss += (x-mean)*(x-mean);
    const stdev = n>1 ? Math.sqrt(ss/(n-1)) : 0;      // sample stdev

    const avgDaily = mean*100;
    const annRet   = mean*D*100;                       // simple annualisation (NOT CAGR)
    const annStd   = stdev*Math.sqrt(D)*100;
    const sharpe   = annStd!==0 ? (annRet-Rf)/annStd : null;

    let dsum=0; for(const x of r) if(x<0) dsum += x*x;
    const downDev = Math.sqrt(dsum/n)*Math.sqrt(D)*100; // annualised downside %, /n
    const sortino = downDev!==0 ? (annRet-Rf)/downDev : null;

    // drawdown / run-up, and underwater curve
    let peak=navs[0], curPeakIdx=0, maxDD=0, ddTroughIdx=0, ddPeakIdx=0;
    let trough=navs[0], maxRU=0;
    const underwater=new Array(obs);
    for(let i=0;i<obs;i++){
      if(navs[i]>peak){peak=navs[i];curPeakIdx=i;}
      const dd = navs[i]/peak-1;
      underwater[i]=dd;
      if(dd<maxDD){maxDD=dd; ddTroughIdx=i; ddPeakIdx=curPeakIdx;}
      if(navs[i]<trough) trough=navs[i];
      const ru = navs[i]/trough-1;
      if(ru>maxRU) maxRU=ru;
    }
    const maxDDpct = -maxDD*100;
    const maxRUpct =  maxRU*100;

    // recovery: from max-DD trough until NAV regains the pre-DD peak value
    const peakVal = navs[ddPeakIdx];
    let recovery=null, recovered=false;
    if(maxDDpct>0){
      for(let i=ddTroughIdx+1;i<obs;i++){
        if(navs[i]>=peakVal){
          recovered=true;
          recovery = recMode==='calendar' ? daysBetween(dates[ddTroughIdx],dates[i])
                                           : (i-ddTroughIdx);
          break;
        }
      }
    } else { recovered=true; recovery=0; }

    const totalRet=(navs[obs-1]/navs[0]-1)*100;
    const wins=r.filter(x=>x>0).length;
    const winRate=wins/n*100;
    let gp=0,gn=0; for(const x of r){ if(x>0)gp+=x; else gn+=x; }
    const gainPain = gn!==0 ? gp/Math.abs(gn) : (gp>0?Infinity:null);
    const calmar = maxDDpct!==0 ? annRet/maxDDpct : null;

    let cagr=null;
    if(navs[0]>0){
      const yrs = daysBetween(dates[0],dates[obs-1])/365.25;
      if(yrs>0) cagr=(Math.pow(navs[obs-1]/navs[0],1/yrs)-1)*100;
    }

    return Object.assign(base,{
      avgDaily, annRet, annStd, sharpe, sortino, downDev,
      maxDD:maxDDpct, maxRU:maxRUpct, recovery, recovered,
      notRecovered: !recovered, totalRet, winRate, gainPain, calmar, cagr,
      ddTroughIdx, ddPeakIdx, underwater, navs, dates
    });
  }
  function addDays(iso,n){ const p=iso.split('-').map(Number); const e=new Date(Date.UTC(p[0],p[1]-1,p[2])+n*86400000); return e.toISOString().slice(0,10); }
  function addMonths(iso,n){ const p=iso.split('-').map(Number); const m=p[1]-1+n;
    const last=new Date(Date.UTC(p[0],m+1,0)).getUTCDate();   // clamp day so 31 Jul −1m → 30 Jun, not 1 Jul
    return new Date(Date.UTC(p[0],m,Math.min(p[2],last))).toISOString().slice(0,10); }
  function monthStart(iso){ const p=iso.split('-'); return p[0]+'-'+p[1]+'-01'; }
  function idxOnOrBefore(series,target){ let k=-1; for(let i=0;i<series.length;i++){ if(series[i][0]<=target)k=i; else break; } return k; }
  // Trailing point-in-time returns (%) as of `asOf` (the window's To date), using the FULL
  // series for the lookback so 1W/MTD/1M stay meaningful even under a narrow window.
  //  1D  = vs previous trading day · 1W = vs last NAV on/before asOf-7d
  //  MTD = vs last NAV of the prior month · 1M = vs last NAV on/before asOf-1 calendar month
  function periodReturns(series, asOf){
    const res={r1d:null,r1w:null,rwtd:null,rmtd:null,r1m:null,r2m:null,r3m:null,r6m:null,rytd:null,rfytd:null,asOf:null};
    if(!series || series.length<2) return res;
    let ai = asOf ? idxOnOrBefore(series, asOf) : series.length-1;
    if(ai<1) return res;
    const aDate=series[ai][0], aNav=series[ai][1]; res.asOf=aDate;
    const ret = target => { const k=idxOnOrBefore(series, target); return (k>=0&&k<ai)?(aNav/series[k][1]-1)*100:null; };
    res.r1d=(aNav/series[ai-1][1]-1)*100;
    res.r1w = ret(addDays(aDate,-7));
    // WTD: vs the last NAV of the previous week (the day before this week's Monday)
    const _p=aDate.split('-').map(Number), _d=new Date(Date.UTC(_p[0],_p[1]-1,_p[2])), _dow=_d.getUTCDay();
    const _mon=new Date(_d.getTime()-((_dow===0?6:_dow-1))*86400000).toISOString().slice(0,10);
    res.rwtd = ret(addDays(_mon,-1));
    let mb=idxOnOrBefore(series, addDays(monthStart(aDate),-1)); if(mb<0) mb=0;
    if(mb<ai) res.rmtd=(aNav/series[mb][1]-1)*100;
    res.r1m = ret(addMonths(aDate,-1));
    res.r2m = ret(addMonths(aDate,-2));
    res.r3m = ret(addMonths(aDate,-3));
    res.r6m = ret(addMonths(aDate,-6));
    // YTD: vs the last NAV on/before prior calendar year-end (31 Dec)
    res.rytd = ret((parseInt(aDate.slice(0,4))-1)+'-12-31');
    // FYTD: Indian financial year (starts 1 Apr); vs last NAV on/before 31 Mar of the FY start
    const yr=parseInt(aDate.slice(0,4)), mo=parseInt(aDate.slice(5,7));
    res.rfytd = ret((mo>=4?yr:yr-1)+'-03-31');
    return res;
  }
  // Up/Down capture vs a benchmark: on days the index rose, what fraction of the index's
  // move did the fund capture (and likewise on down days). series = windowed [[date,nav]];
  // benchByDate = {date: indexClose}. up = Σ fundRet(up days) / Σ indexRet(up days) × 100.
  //  down<100 = fell less than the index; down<0 = actually ROSE when the index fell.
  function captureRatios(series, benchByDate){
    const res={upCapture:null,downCapture:null,upDays:0,downDays:0,beta:null};
    if(!series || series.length<3 || !benchByDate) return res;
    let un=0,ud=0,dn=0,dd=0,uc=0,dc=0;
    let sxy=0,sxx=0,mfr=0,mbr=0,nn=0;
    const frs=[],brs=[];
    for(let i=1;i<series.length;i++){
      const b0=benchByDate[series[i-1][0]], b1=benchByDate[series[i][0]];
      if(b0==null||b1==null) continue;
      const fr=series[i][1]/series[i-1][1]-1, br=b1/b0-1;
      frs.push(fr); brs.push(br); mfr+=fr; mbr+=br; nn++;
      if(br>0){ un+=fr; ud+=br; uc++; }
      else if(br<0){ dn+=fr; dd+=br; dc++; }
    }
    if(nn>1){ mfr/=nn; mbr/=nn;
      for(let i=0;i<nn;i++){ sxy+=(brs[i]-mbr)*(frs[i]-mfr); sxx+=(brs[i]-mbr)*(brs[i]-mbr); }
      if(sxx>0) res.beta=sxy/sxx;
    }
    res.upDays=uc; res.downDays=dc;
    res.upCapture = ud!==0 ? (un/ud)*100 : null;
    res.downCapture = dd!==0 ? (dn/dd)*100 : null;
    return res;
  }
  const api={compute, windowSeries, daysBetween, periodReturns, captureRatios};
  if(typeof module!=='undefined' && module.exports) module.exports=api;
  return api;
})();
// ==METRICS-END==
</script>

<script>
(function(){
  const M = SIFMetrics;
  const $ = s=>document.querySelector(s);
  let DATA=null;              // {generated, schemes:[{code,name,cat,sif,isin,series}]}
  let ROWS=[];               // computed rows
  let sortKey='name', sortDir=1;   // land on a clean A→Z order (per strategy group); click a metric header to re-sort
  const openSet=new Set();
  let PORT=null;             // portfolios/index.json {periods, amcs, schemes:{code:{periods:{}}}}
  const portCache=new Map(); // period-file path -> fetched fund JSON
  let BENCH=null;            // {date: NIFTY-50 close} for up/down capture
  let BENCHNAME='NIFTY 50';
  const compareSet=new Set();// scheme codes selected for the compare chart

  // ---- strategy grouping ----
  const GROUPS=[
    {id:'hls', label:'Hybrid Long-Short', color:'#5b5bf0', match:c=>/hybrid long-short/i.test(c)},
    {id:'els', label:'Equity Long-Short', color:'#0e9aa7', match:c=>/equity long-short/i.test(c) && !/ex-top/i.test(c)},
    {id:'smid',label:'Ex-Top 100 SMID',   color:'#8b5cf6', match:c=>/ex-top ?100/i.test(c)},
    {id:'sr',  label:'Sector Rotation',   color:'#d9820b', match:c=>/sector rotation/i.test(c)},
    {id:'alloc',label:'Allocator',        color:'#c026d3', match:c=>/allocator/i.test(c)},
    {id:'other',label:'Other',            color:'#64748b', match:c=>true},
  ];
  function groupOf(cat){ for(const g of GROUPS){ if(g.match(cat||'')) return g; } return GROUPS[GROUPS.length-1]; }

  // map a scheme's AMC brand (nav "sif") to its registry metadata (parent, managers, strategy…)
  let _sifMeta=null;
  function normStr(s){ return (''+s).toLowerCase().replace(/[^a-z0-9]/g,''); }
  function amcMetaFor(sif){
    if(!PORT||!PORT.amcs) return null;
    if(!_sifMeta){ _sifMeta={}; for(const k in PORT.amcs){ const a=PORT.amcs[k]; if(a&&a.nav_sif) _sifMeta[normStr(a.nav_sif)]=a; } }
    return _sifMeta[normStr(sif)]||null;
  }
  function shortParent(p){ return (''+p).replace(/\s+(Asset Management|Sun Life AMC|Mutual Fund|AMC|Investment Managers|Money Managers|Funds Management).*$/i,'').trim()||p; }

  // amc + plan parts of a scheme name for compact display
  function splitName(name){
    const parts=name.split(' - ');
    const plan=parts.slice(1).join(' · ');
    return {head:parts[0], plan};
  }

  // ---- columns ----
  const COLS=[
    {k:'name', label:'Scheme', cls:'', sortable:true, val:r=>r.name},
    {k:'rangeFrom', label:'Range', cls:'r', sortable:true, val:r=>r.m.rangeFrom||''},
    {k:'obs', label:'Obs', cls:'r num', sortable:true, val:r=>r.m.obs, fmt:r=>fmtObs(r)},
    {k:'r1d', label:'1D %', cls:'r num', sortable:true, val:r=>r.m.r1d, fmt:r=>signed(r.m.r1d,2)},
    {k:'r1w', label:'1W %', cls:'r num', sortable:true, val:r=>r.m.r1w, fmt:r=>signed(r.m.r1w,2)},
    {k:'rwtd', label:'WTD %', cls:'r num', sortable:true, val:r=>r.m.rwtd, fmt:r=>signed(r.m.rwtd,2)},
    {k:'rmtd', label:'MTD %', cls:'r num', sortable:true, val:r=>r.m.rmtd, fmt:r=>signed(r.m.rmtd,2)},
    {k:'r1m', label:'1M %', cls:'r num', sortable:true, val:r=>r.m.r1m, fmt:r=>signed(r.m.r1m,2)},
    {k:'r2m', label:'2M %', cls:'r num', sortable:true, val:r=>r.m.r2m, fmt:r=>signed(r.m.r2m,2)},
    {k:'r3m', label:'3M %', cls:'r num', sortable:true, val:r=>r.m.r3m, fmt:r=>signed(r.m.r3m,2)},
    {k:'r6m', label:'6M %', cls:'r num', sortable:true, val:r=>r.m.r6m, fmt:r=>signed(r.m.r6m,2)},
    {k:'rytd', label:'YTD %', cls:'r num', sortable:true, val:r=>r.m.rytd, fmt:r=>signed(r.m.rytd,2)},
    {k:'rfytd', label:'FYTD %', cls:'r num', sortable:true, val:r=>r.m.rfytd, fmt:r=>signed(r.m.rfytd,2)},
    {k:'totalRet', label:'Total %', cls:'r num', sortable:true, val:r=>r.m.totalRet, fmt:r=>signed(r.m.totalRet,2)},
    {k:'annRet', label:'Ann Ret %', cls:'r num', sortable:true, val:r=>r.m.annRet, fmt:r=>signed(r.m.annRet,1)},
    {k:'annStd', label:'Ann Std %', cls:'r num', sortable:true, val:r=>r.m.annStd, fmt:r=>num(r.m.annStd,1)},
    {k:'sharpe', label:'Sharpe', cls:'r num', sortable:true, val:r=>r.m.sharpe, fmt:r=>band(r.m.sharpe,2,BAND.sharpe)},
    {k:'sortino', label:'Sortino', cls:'r num', sortable:true, val:r=>r.m.sortino, fmt:r=>band(r.m.sortino,2,BAND.sortino)},
    {k:'calmar', label:'Calmar', cls:'r num', sortable:true, val:r=>r.m.calmar, fmt:r=>band(r.m.calmar,2,BAND.calmar)},
    {k:'maxDD', label:'Max DD %', cls:'r num', sortable:true, val:r=>r.m.maxDD, fmt:r=>bandDD(r.m.maxDD)},
    {k:'maxRU', label:'Max RU %', cls:'r num', sortable:true, val:r=>r.m.maxRU, fmt:r=>num(r.m.maxRU,2)},
    {k:'recovery', label:'Recovery', cls:'r num', sortable:true, val:r=>recVal(r.m), fmt:r=>recFmt(r.m)},
    {k:'winRate', label:'Win %', cls:'r num', sortable:true, val:r=>r.m.winRate, fmt:r=>band(r.m.winRate,1,BAND.win)},
    {k:'gainPain', label:'G/P', cls:'r num', sortable:true, val:r=>r.m.gainPain, fmt:r=>band(r.m.gainPain,2,BAND.gp)},
    {k:'upCapture', label:'Up Cap %', cls:'r num', sortable:true, val:r=>r.m.upCapture, fmt:r=>num(r.m.upCapture,0)},
    {k:'downCapture', label:'Dn Cap %', cls:'r num', sortable:true, val:r=>r.m.downCapture, fmt:r=>capDD(r.m.downCapture)},
    {k:'uw', label:'Underwater', cls:'r', sortable:false, val:r=>0, fmt:r=>sparkUW(r.m)},
  ];

  // plain-language definitions shown on hover over each column header
  const HELP={
    name:'Fund house / scheme. Click a row to see holdings, strategy & manager.',
    rangeFrom:'First → last NAV date actually available inside your window.',
    obs:'Number of daily NAVs in the window. ▲ = fewer than "Min obs" (too little data to trust the ratios).',
    r1d:'Return over the last 1 trading day.',
    r1w:'Return over the last 1 week (7 calendar days).',
    rwtd:'Week-to-date: return since the close of last week (this week so far).',
    rmtd:'Month-to-date: return since the end of last month.',
    r1m:'Return over the last 1 month.',
    r2m:'Return over the last 2 months.',
    r3m:'Return over the last 3 months.',
    r6m:'Return over the last 6 months.',
    rytd:'Calendar year-to-date: return since 31 December last year.',
    rfytd:'Financial year-to-date (India, since 1 April): return since 31 March.',
    totalRet:'Total return across the whole window (last NAV ÷ first NAV − 1).',
    annRet:'Return scaled to a yearly rate (simple, not compounded). Big numbers on very short histories are an artefact, not skill.',
    annStd:'How much the fund bounces around year-to-year (volatility). Lower = steadier.',
    sharpe:'Reward for the risk taken: extra return above a safe deposit, per unit of ups-and-downs. Higher is better. Above 1 is good, above 2 is strong.',
    sortino:'Like Sharpe but only counts DOWNSIDE swings (ignores good volatility). Higher is better; punishes losses, not gains.',
    calmar:'Yearly return divided by the worst peak-to-trough fall. Higher = more return per unit of pain.',
    maxDD:'Maximum drawdown: the worst peak-to-trough drop in the window. Smaller (less negative) is better.',
    maxRU:'Maximum run-up: the largest trough-to-peak rise in the window.',
    recovery:'Days taken to climb back to the previous peak after the worst fall. "not rec." = not yet recovered.',
    winRate:'Share of days the fund went up. Above 50% means more up-days than down.',
    gainPain:'Gain-to-pain: total gains divided by total losses. Above 1 means gains outweighed losses.',
    upCapture:'Up capture vs NIFTY 50: on days the index rose, the fund captured this % of the index’s gain. 100 = matched the market; lower = rose less (typical for a hedged long-short fund).',
    downCapture:'Down capture vs NIFTY 50: on days the index fell, the fund moved this % of the index’s fall. Below 100 = fell less than the market; below 0 = actually ROSE when the market fell (ideal for long-short).',
    uw:'Underwater curve: how far below its last peak the fund was, over time.',
  };
  // Columns hidden via the Columns picker. Seeded to a curated set on phones so the comparison
  // table stays readable; the user can show/hide any column on any device.
  // Phones start showing just these 4 (fit the screen, no side-scroll): 1M, Total, Sharpe, Dn Cap.
  // Users swap in any timeframe/metric via the Columns picker, or open Compare for the full matrix.
  const MOBILE_HIDE=['rangeFrom','obs','r1d','r1w','rwtd','rmtd','r2m','r3m','r6m','rytd','rfytd',
    'annRet','annStd','sortino','calmar','maxDD','maxRU','recovery','winRate','gainPain','upCapture','uw'];
  let hiddenCols=new Set();

  // ---- formatting ----
  const na='<span class="na">—</span>';
  function num(v,d){ return (v==null||!isFinite(v))?na:'<span>'+v.toFixed(d)+'</span>'; }
  function signed(v,d){ if(v==null||!isFinite(v))return na;
    const c=v>=0?'var(--pos)':'var(--neg)'; return '<span style="color:'+c+'">'+(v>=0?'+':'')+v.toFixed(d)+'</span>'; }
  function fmtObs(r){ const f=r.m.obs<r.minobs?'<span class="flag" title="below min obs">▲</span>':'';
    return '<span>'+r.m.obs+'</span>'+f; }
  function recVal(m){ if(m.maxDD<=0)return -1; return m.recovered?m.recovery:1e9; }
  function recFmt(m){ if(m.maxDD<=0) return na;
    if(!m.recovered) return '<span style="color:var(--amber)">not rec.</span>';
    return '<span>'+m.recovery+'</span>'; }

  // conditional colour bands ---------------------------------------------
  const BAND={
    sharpe:[[-1e9,'poor'],[0,'weak'],[1,'good'],[2,'strong']],
    sortino:[[-1e9,'poor'],[0,'weak'],[1.5,'good'],[3,'strong']],
    calmar:[[-1e9,'poor'],[0,'weak'],[1,'good'],[3,'strong']],
    win:[[-1e9,'poor'],[45,'weak'],[52,'good'],[58,'strong']],
    gp:[[-1e9,'poor'],[1,'weak'],[1.5,'good'],[2.5,'strong']],
  };
  const TINT={poor:'rgba(240,104,127,.28)',weak:'rgba(231,184,75,.20)',
              good:'rgba(75,210,138,.20)',strong:'rgba(75,210,138,.55)'};
  const TINT_DARK={poor:'rgba(255,125,144,.30)',weak:'rgba(240,198,94,.26)',
              good:'rgba(95,223,154,.24)',strong:'rgba(95,223,154,.52)'};
  function darkMode(){ return document.documentElement.getAttribute('data-theme')==='dark'; }
  function tierOf(v,scale){ let t='weak'; for(const [thr,name] of scale){ if(v>=thr) t=name; } return t; }
  function band(v,d,scale){ if(v==null||!isFinite(v)) return na;
    const t=tierOf(v,scale); const txt=(v===Infinity?'∞':v.toFixed(d));
    const tint=(darkMode()?TINT_DARK:TINT)[t];
    return '<span class="num" style="display:inline-block;min-width:44px;padding:1px 5px;border-radius:2px;background:'+tint+'">'+txt+'</span>'; }
  function bandDD(v){ if(v==null)return na;
    // worse (bigger) DD -> stronger red
    let a=0; if(v>0) a=Math.min(darkMode()?.5:.42,.12+v/38);
    const c=darkMode()?'255,125,144':'240,104,127';
    return '<span class="num" style="display:inline-block;min-width:44px;padding:1px 5px;border-radius:2px;background:rgba('+c+','+a.toFixed(3)+')">'+v.toFixed(2)+'</span>'; }

  // down-capture: lower is better; <=0 (rose while market fell) is ideal -> greens; >100 -> red
  function capDD(v){ if(v==null||!isFinite(v)) return na;
    const g=darkMode()?'95,223,154':'75,210,138', rd=darkMode()?'255,125,144':'240,104,127';
    let bg;
    if(v<=0) bg='rgba('+g+','+(darkMode()?.52:.5)+')';
    else if(v<100) bg='rgba('+g+','+(0.30*(1-v/100)+0.05).toFixed(3)+')';
    else bg='rgba('+rd+','+Math.min(.32,(v-100)/300+0.08).toFixed(3)+')';
    return '<span class="num" style="display:inline-block;min-width:40px;padding:1px 5px;border-radius:2px;background:'+bg+'">'+v.toFixed(0)+'</span>'; }

  // inline underwater sparkline -----------------------------------------
  function sparkUW(m){
    const uw=m.underwater||[]; const W=104,H=22;
    if(uw.length<2) return '<svg class="spark" width="'+W+'" height="'+H+'"></svg>';
    const min=Math.min(...uw, -1e-9);
    const step=W/(uw.length-1);
    let d='M0 0';
    for(let i=0;i<uw.length;i++){
      const x=(i*step).toFixed(1);
      const y=(min<0? (uw[i]/min)*(H-2):0).toFixed(1);
      d+=' L'+x+' '+y;
    }
    d+=' L'+W+' 0 Z';
    return '<svg class="spark" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">'+
      '<path d="'+d+'" fill="rgba(240,104,127,.30)" stroke="var(--neg)" stroke-width="1"/></svg>';
  }

  // ---- compute all rows for current window ----
  function recompute(){
    if(!DATA) return;
    const from=$('#from').value, to=$('#to').value;
    const D=+$('#days').value||252, Rf=+$('#rf').value||0;
    const recoveryMode=$('#recmode').value;
    const minobs=+$('#minobs').value||0;
    let myrx=null,srx=null;
    try{ if($('#myrx').value.trim()) myrx=new RegExp($('#myrx').value.trim(),'i'); }catch(e){}
    try{ if($('#search').value.trim()) srx=new RegExp($('#search').value.trim(),'i'); }catch(e){}

    const strat=$('#strat').value, plan=$('#plan').value, opt=$('#opt').value;
    ROWS=DATA.schemes.map(s=>{
      const w=M.windowSeries(s.series, from, to);
      const m=M.compute(w, {D,Rf,recoveryMode});
      // trailing returns anchored at the window To (independent of From)
      const anchor = to || (s.series.length? s.series[s.series.length-1][0] : null);
      Object.assign(m, M.periodReturns(s.series, anchor));
      Object.assign(m, M.captureRatios(w, BENCH));   // up/down capture vs NIFTY 50
      return {code:s.code, name:s.name, cat:s.cat, sif:s.sif, isin:s.isin,
              group:groupOf(s.cat), m, minobs,
              mine: myrx?myrx.test(s.name):false};
    });
    if(srx) ROWS=ROWS.filter(r=>srx.test(r.name)||srx.test(r.sif));
    ROWS=ROWS.filter(r=>{
      if(strat!=='all' && r.group.id!==strat) return false;
      if(plan==='direct'  && !/direct/i.test(r.name)) return false;
      if(plan==='regular' && !/regular/i.test(r.name)) return false;
      if(opt==='growth' && !/growth/i.test(r.name)) return false;
      if(opt==='idcw'   && !/idcw|dividend|payout|re-?invest/i.test(r.name)) return false;
      return true;
    });
    render();
    updateStatus(from,to);
  }

  function updateStatus(from,to){
    const all=ROWS.length;
    const enough=ROWS.filter(r=>r.m.obs>=r.minobs).length;
    const short=ROWS.filter(r=>r.m.obs>0 && r.m.obs<30).length;
    $('#dot').className='dot';
    $('#stat').innerHTML='<b>'+all+'</b> schemes · <b>'+enough+'</b> ≥ min obs';
    $('#cov').textContent='window '+from+' → '+to+' · data '+DATA.dataFrom+' → '+DATA.dataTo+
       ' · generated '+(DATA.generated||'').slice(0,16).replace('T',' ');
    // data-quality flags
    const fl=[];
    if(short) fl.push(short+' scheme(s) < 30 obs');
    if(DATA.qc && DATA.qc.jumps) fl.push(DATA.qc.jumps+' daily NAV jump(s) > 10%');
    if(DATA.qc && DATA.qc.dupes) fl.push(DATA.qc.dupes+' duplicate date(s) collapsed');
    $('#flags').textContent = fl.length? '⚠ '+fl.join(' · '):'';
  }

  // ---- render ----
  function renderHead(){
    const tr=$('#head'); tr.innerHTML='';
    COLS.forEach(c=>{
      const th=document.createElement('th');
      th.className=c.cls.replace('num','')+' col-'+c.k+(hiddenCols.has(c.k)?' hidden-col':'');
      th.innerHTML=c.label+(HELP[c.k]?'<span class="qh">ⓘ</span>':'')+(sortKey===c.k?'<span class="ar">'+(sortDir<0?'▼':'▲')+'</span>':'');
      if(HELP[c.k]) th.title=HELP[c.k];
      if(c.sortable){ th.onclick=()=>{ if(sortKey===c.k) sortDir*=-1; else {sortKey=c.k;sortDir=-1;} render(); }; }
      else th.style.cursor='default';
      tr.appendChild(th);
    });
  }
  function cmp(a,b){
    const col=COLS.find(c=>c.k===sortKey)||COLS[6];
    let va=col.val(a), vb=col.val(b);
    if(sortKey==='name'){ va=(''+va).toLowerCase(); vb=(''+vb).toLowerCase(); return va<vb?-sortDir:va>vb?sortDir:0; }
    const na=(va==null||!isFinite(va)), nb=(vb==null||!isFinite(vb));
    if(na&&nb)return 0; if(na)return 1; if(nb)return -1;   // nulls sink
    return (va-vb)*sortDir;
  }
  function render(){
    renderHead();
    const body=$('#body'); body.innerHTML='';
    const byGroup=new Map(GROUPS.map(g=>[g.id,[]]));
    ROWS.forEach(r=>byGroup.get(r.group.id).push(r));
    GROUPS.forEach(g=>{
      const rows=byGroup.get(g.id); if(!rows.length) return;
      rows.sort(cmp);
      const gtr=document.createElement('tr'); gtr.className='grp';
      gtr.innerHTML='<td colspan="'+COLS.length+'" style="border-left:3px solid '+g.color+
        ';background:'+g.color+'14"><span class="gt" style="color:'+g.color+'">'+g.label+
        '</span> <span class="gc">· '+rows.length+' schemes</span></td>';
      body.appendChild(gtr);
      rows.forEach(r=>{
        body.appendChild(renderRow(r));
        if(openSet.has(r.code)) body.appendChild(renderExpand(r));
      });
    });
    if(!ROWS.length) body.innerHTML='<tr><td colspan="'+COLS.length+'" style="padding:20px;color:var(--ink-dim)">No schemes match.</td></tr>';
  }
  function renderRow(r){
    const tr=document.createElement('tr');
    tr.className=(r.m.obs<r.minobs?'low ':'')+(r.mine?'myfund ':'')+(openSet.has(r.code)?'open':'');
    const sn=splitName(r.name);
    const first=document.createElement('td'); first.className='nm';
    if(!r.mine) first.style.borderLeft='3px solid '+r.group.color+'66';
    const meta=amcMetaFor(r.sif);
    let parent='';
    if(meta&&meta.parent){ const sp=shortParent(meta.parent), a=normStr(r.sif), b=normStr(sp);
      if(a.indexOf(b)<0 && b.indexOf(a)<0) parent=' <span class="parent">'+esc(sp)+'</span>'; }
    const badge=(PORT&&PORT.schemes&&PORT.schemes[r.code])?' <span class="pbadge" title="Portfolio holdings disclosed">▣</span>':'';
    first.innerHTML='<input type="checkbox" class="cmp" title="Add to compare chart"'+(compareSet.has(r.code)?' checked':'')+'>'+
      '<span class="caret">▶</span> <span class="amc">'+esc(r.sif||sn.head)+'</span>'+parent+badge+
      (sn.plan?' <span class="plan">'+esc(sn.plan)+'</span>':'');
    first.title=r.name;
    const cb=first.querySelector('.cmp');
    cb.onclick=e=>{ e.stopPropagation(); if(cb.checked)compareSet.add(r.code); else compareSet.delete(r.code); updateCompareBtn(); };
    first.onclick=e=>{ if(e.target!==cb) toggle(r.code); };
    tr.appendChild(first);
    for(let i=1;i<COLS.length;i++){
      const c=COLS[i]; const td=document.createElement('td');
      td.className=c.cls.replace('num','')+' num col-'+c.k+(hiddenCols.has(c.k)?' hidden-col':'');
      td.setAttribute('data-label', c.label);   // field label used in the mobile card view
      if(c.k==='rangeFrom'){ td.className='r rng num col-rangeFrom'+(hiddenCols.has('rangeFrom')?' hidden-col':'');
        td.innerHTML = r.m.rangeFrom? '<span>'+shortD(r.m.rangeFrom)+'→'+shortD(r.m.rangeTo)+'</span>':na; }
      else td.innerHTML = c.fmt? c.fmt(r): c.val(r);
      tr.appendChild(td);
    }
    return tr;
  }
  function toggle(code){ if(openSet.has(code))openSet.delete(code); else openSet.add(code); render(); }

  function renderExpand(r){
    const tr=document.createElement('tr'); tr.className='expand';
    const td=document.createElement('td'); td.colSpan=COLS.length;
    const m=r.m;
    const meta=[
      ['Scheme', esc(r.name)], ['Code', r.code], ['ISIN', r.isin||'—'],
      ['Avg daily', m.avgDaily!=null?m.avgDaily.toFixed(4)+'%':'—'],
      ['Ann ret (simple)', m.annRet!=null?m.annRet.toFixed(2)+'%':'—'],
      ['CAGR', m.cagr!=null?m.cagr.toFixed(2)+'%':'—'],
      ['Downside dev (ann)', m.downDev!=null?m.downDev.toFixed(2)+'%':'—'],
      ['Obs / returns', m.obs+' / '+m.nret],
      ['NAV first→last', m.navs&&m.navs.length? m.navs[0]+' → '+m.navs[m.navs.length-1]:'—'],
    ].map(x=>'<span><b>'+x[0]+':</b> '+x[1]+'</span>').join('');
    td.innerHTML='<div class="exp-in"><div class="exp-meta num">'+meta+'</div>'+
      '<div class="chart"><h4>NAV path</h4>'+navChart(m)+'</div>'+
      '<div class="chart"><h4>Underwater (drawdown)</h4>'+uwChart(m)+'</div>'+
      '<div class="port" id="port-'+esc(r.code)+'"><h4>Portfolio (disclosed holdings)</h4>'+
        '<div class="port-body none">…</div></div></div>';
    tr.appendChild(td);
    fillPortfolio(r, td.querySelector('#port-'+cssId(r.code)+' .port-body'));
    return tr;
  }
  function cssId(s){ return (''+s).replace(/[^A-Za-z0-9_-]/g,'\\$&'); }

  // ---- chart axis helpers (shared by NAV / underwater / compare charts) ----
  function niceNum(range,round){ if(!(range>0))return 1; const e=Math.floor(Math.log10(range)),f=range/Math.pow(10,e);
    const nf=round?(f<1.5?1:f<3?2:f<7?5:10):(f<=1?1:f<=2?2:f<=5?5:10); return nf*Math.pow(10,e); }
  function niceTicks(min,max,n){ n=n||5; if(!(max>min))max=min+1; const step=niceNum((max-min)/(n-1),true)||1;
    const lo=Math.floor(min/step)*step, hi=Math.ceil(max/step)*step, t=[];
    for(let v=lo;v<=hi+step*0.5;v+=step) t.push(+v.toFixed(6)); return {ticks:t,min:lo,max:hi}; }
  function isoAddDays(iso,n){ const p=iso.split('-').map(Number); return new Date(Date.UTC(p[0],p[1]-1,p[2])+n*86400000).toISOString().slice(0,10); }
  function xIndexTicks(dates,k){ const n=dates.length; if(n<2)return[]; k=Math.min(k||5,n); const o=[];
    for(let i=0;i<k;i++){ const idx=Math.round(i*(n-1)/(k-1)); o.push({pos:idx/(n-1),label:shortD(dates[idx])}); } return o; }
  function xTimeTicks(dmin,span,k){ k=k||6; const o=[]; for(let i=0;i<k;i++){ const pos=i/(k-1);
    o.push({pos,label:shortD(isoAddDays(dmin,Math.round(pos*span)))}); } return o; }
  // renders gridlines/ticks/frame/titles into rect [L,T]-[W-R,H-B]; returns {svg,mapX,mapY}
  function axisSVG(g,yt,yfmt,xticks,ytitle,xtitle){
    const px0=g.L,px1=g.W-g.R,py0=g.T,py1=g.H-g.B;
    const mapY=v=>py1-(v-yt.min)/(yt.max-yt.min)*(py1-py0), mapX=p=>px0+p*(px1-px0);
    let s='';
    yt.ticks.forEach(v=>{ const y=mapY(v); s+='<line x1="'+px0+'" x2="'+px1+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="var(--line)"/>'+
      '<text x="'+(px0-5)+'" y="'+(y+3).toFixed(1)+'" text-anchor="end" font-size="9" fill="var(--ink-faint)">'+yfmt(v)+'</text>'; });
    xticks.forEach(t=>{ const x=mapX(t.pos); s+='<line x1="'+x.toFixed(1)+'" x2="'+x.toFixed(1)+'" y1="'+py1+'" y2="'+(py1+4)+'" stroke="var(--line2)"/>'+
      '<text x="'+x.toFixed(1)+'" y="'+(py1+15)+'" text-anchor="middle" font-size="9" fill="var(--ink-faint)">'+t.label+'</text>'; });
    s+='<line x1="'+px0+'" x2="'+px0+'" y1="'+py0+'" y2="'+py1+'" stroke="var(--line2)"/><line x1="'+px0+'" x2="'+px1+'" y1="'+py1+'" y2="'+py1+'" stroke="var(--line2)"/>';
    if(ytitle){ const my=((py0+py1)/2).toFixed(1); s+='<text x="12" y="'+my+'" transform="rotate(-90 12 '+my+')" text-anchor="middle" font-size="9.5" fill="var(--ink-dim)">'+ytitle+'</text>'; }
    if(xtitle) s+='<text x="'+((px0+px1)/2).toFixed(1)+'" y="'+(g.H-2)+'" text-anchor="middle" font-size="9.5" fill="var(--ink-dim)">'+xtitle+'</text>';
    return {svg:s,mapX,mapY};
  }

  function navChart(m){
    const v=m.navs||[], dates=m.dates||[]; if(v.length<2) return '<div class="sub">insufficient data</div>';
    const g={L:46,R:10,T:10,B:30,W:470,H:184};
    const yt=niceTicks(Math.min(...v),Math.max(...v),5);
    const ax=axisSVG(g,yt,x=>x.toFixed(2),xIndexTicks(dates,5),'NAV (₹)','Date');
    let d=''; v.forEach((y,i)=>{ d+=(i?'L':'M')+ax.mapX(i/(v.length-1)).toFixed(1)+' '+ax.mapY(y).toFixed(1)+' '; });
    return '<svg width="100%" viewBox="0 0 '+g.W+' '+g.H+'" style="display:block;width:100%">'+ax.svg+
      '<path d="'+d+'" fill="none" stroke="var(--accent)" stroke-width="1.5"/></svg>';
  }
  function uwChart(m){
    const uw=m.underwater||[], dates=m.dates||[]; if(uw.length<2) return '<div class="sub">insufficient data</div>';
    const g={L:46,R:10,T:10,B:30,W:470,H:184}; const mn=Math.min(...uw,-1e-9);
    const yt=niceTicks(mn*100,0,5);
    const ax=axisSVG(g,yt,x=>x.toFixed(0)+'%',xIndexTicks(dates,5),'Drawdown %','Date');
    const y0=ax.mapY(0); let d='M'+ax.mapX(0).toFixed(1)+' '+y0.toFixed(1);
    uw.forEach((y,i)=>{ d+=' L'+ax.mapX(i/(uw.length-1)).toFixed(1)+' '+ax.mapY(y*100).toFixed(1); });
    d+=' L'+ax.mapX(1).toFixed(1)+' '+y0.toFixed(1)+' Z';
    return '<svg width="100%" viewBox="0 0 '+g.W+' '+g.H+'" style="display:block;width:100%">'+ax.svg+
      '<path d="'+d+'" fill="rgba(240,104,127,.28)" stroke="var(--neg)" stroke-width="1.3"/></svg>';
  }

  // ---- portfolio (disclosed holdings) ----
  const ALLOC_KEYS=[
    ['equity','Equity','#5b5bf0'],['debt','Debt','#0e9aa7'],
    ['money_market','Money mkt','#8b5cf6'],['cash_other','Cash / other','#64748b']];

  function fillPortfolio(r, node){
    if(!node) return;
    const entry = PORT && PORT.schemes && PORT.schemes[r.code];
    if(!entry || !entry.periods || !Object.keys(entry.periods).length){
      const m=amcMetaFor(r.sif)||{};
      const amc = r.sif ? esc(r.sif) : 'the fund house';
      const bits=[];
      if(m.strategy) bits.push('<div class="pstrat"><span><b>Strategy:</b> '+esc(m.strategy)+'</span>'+
        (m.managers?'<span class="mgr"><b>Fund manager:</b> '+esc(m.managers)+'</span>':'')+'</div>');
      const pl=[]; if(m.presentation) pl.push('<a href="'+esc(m.presentation)+'" target="_blank" rel="noopener">presentation ↗</a>');
      if(m.disclosure_page) pl.push('<a href="'+esc(m.disclosure_page)+'" target="_blank" rel="noopener">'+esc(shortParent(m.parent)||amc)+' ↗</a>');
      node.className='port-body';
      node.innerHTML=(bits.join('')||'')+
        '<div class="none">No holdings disclosed here yet — SIFs report portfolios <b>bi-monthly</b>. '+
        'When '+amc+' publishes a machine-readable file it is fetched, saved to the repo, and shown here.'+
        (pl.length?'<div style="margin-top:4px">'+pl.join(' · ')+'</div>':'')+'</div>';
      return;
    }
    node.className='port-body';
    const periods=Object.keys(entry.periods).sort().reverse();
    const sel='<label style="font-size:10.5px;color:var(--ink-faint)">Period '+
      '<select data-code="'+esc(r.code)+'">'+periods.map(p=>'<option>'+p+'</option>').join('')+'</select></label>';
    node.innerHTML='<div class="phead">'+sel+'<span class="pstat sub">loading…</span></div><div class="pmain"></div>';
    const selEl=node.querySelector('select');
    const load=()=>loadPortfolioPeriod(entry, selEl.value, node);
    selEl.onchange=load; load();
  }

  function loadPortfolioPeriod(entry, period, node){
    const path=entry.periods[period];
    const main=node.querySelector('.pmain'), stat=node.querySelector('.pstat');
    const draw=fund=>{ stat.textContent=''; main.innerHTML=portfolioHTML(fund, entry); };
    if(portCache.has(path)) return draw(portCache.get(path));
    stat.textContent='loading…';
    fetch(path,{cache:'no-store'}).then(r=>{ if(!r.ok)throw new Error(r.status); return r.json(); })
      .then(f=>{ portCache.set(path,f); draw(f); })
      .catch(e=>{ stat.textContent='could not load portfolio ('+e.message+')'; });
  }

  function portfolioHTML(f, entry){
    const amc = (PORT.amcs&&PORT.amcs[f.amc])||{};
    // header: as-of, net assets, holdings, source links
    const pres=f.presentation||amc.presentation||'';
    const links=[];
    if(f.raw) links.push('<a href="'+esc(f.raw)+'">raw file ↧</a>');
    if(pres) links.push('<a href="'+esc(pres)+'" target="_blank" rel="noopener">presentation ↗</a>');
    if(amc.disclosure_page) links.push('<a href="'+esc(amc.disclosure_page)+'" target="_blank" rel="noopener">'+esc(shortParent(amc.parent)||amc.name||f.amc)+' ↗</a>');
    const head='<div class="phead">'+
      '<span><b>'+esc(f.fund_name)+'</b></span>'+
      (amc.parent?'<span class="sub">'+esc(shortParent(amc.parent))+'</span>':'')+
      '<span>as of <b>'+esc(f.as_of||f.period)+'</b></span>'+
      (f.net_assets_cr!=null?'<span>net assets <b class="num">₹'+f.net_assets_cr.toLocaleString('en-IN')+' Cr</b></span>':'')+
      '<span><b>'+f.n_holdings+'</b> holdings</span>'+
      '<span>'+links.join(' · ')+'</span></div>'+
      ((f.strategy||f.managers)?'<div class="pstrat">'+
        (f.strategy?'<span><b>Strategy:</b> '+esc(f.strategy)+'</span>':'')+
        (f.managers?'<span class="mgr"><b>Fund manager'+(f.managers.indexOf(',')>=0?'s':'')+':</b> '+esc(f.managers)+'</span>':'')+
        '</div>':'');

    // allocation bar
    const a=f.allocation||{}; let alloc='';
    const segs=ALLOC_KEYS.filter(k=>a[k[0]]>0.01);
    if(segs.length){
      alloc='<h5>Asset allocation</h5><div class="allocbar">'+
        segs.map(k=>'<span style="width:'+Math.max(0,a[k[0]]).toFixed(2)+'%;background:'+k[2]+'" title="'+k[1]+' '+a[k[0]].toFixed(1)+'%"></span>').join('')+
        '</div><div class="alloclegend">'+
        segs.map(k=>'<span><i style="background:'+k[2]+'"></i>'+k[1]+' '+a[k[0]].toFixed(1)+'%</span>').join('')+'</div>';
    }
    // long/short from derivatives + cash equity
    let ls='';
    const derivs=f.derivatives||[];
    if(derivs.length){
      const dl=derivs.filter(d=>d.position==='Long').reduce((s,d)=>s+(d.weight||0),0);
      const ds=derivs.filter(d=>d.position==='Short').reduce((s,d)=>s+(d.weight||0),0);
      ls='<div class="ls"><span>Derivatives: <b style="color:var(--pos)">+'+dl.toFixed(2)+'%</b> long</span>'+
         '<span><b style="color:var(--neg)">−'+ds.toFixed(2)+'%</b> short</span>'+
         '<span class="sub">('+derivs.length+' F&O legs)</span></div>';
    }
    // sectors (equity)
    let sec='';
    const secs=(f.sectors||[]).slice(0,8);
    if(secs.length){
      const mx=Math.max(...secs.map(s=>s.weight));
      sec='<h5>Equity sectors</h5><table class="hold">'+secs.map(s=>
        '<tr><td class="nm2">'+esc(s.sector)+'</td><td class="w num" style="min-width:70px">'+
        '<span class="bar" style="width:'+(s.weight/mx*100).toFixed(0)+'%"></span>'+s.weight.toFixed(2)+'%</td></tr>').join('')+'</table>';
    }
    // top holdings
    const top=(f.top||f.holdings||[]).slice(0,12);
    const mxh=Math.max(1,...top.map(h=>Math.abs(h.weight||0)));
    const holds='<h5>Top holdings</h5><table class="hold">'+top.map(h=>
      '<tr><td class="nm2">'+esc(h.name)+(h.sector?' <span class="sec">'+esc(h.sector)+'</span>':'')+
      '</td><td class="w num" style="min-width:64px">'+
      '<span class="bar" style="width:'+(Math.abs(h.weight||0)/mxh*100).toFixed(0)+'%"></span>'+
      (h.weight!=null?h.weight.toFixed(2)+'%':'—')+'</td></tr>').join('')+'</table>';

    return head+'<div class="pgrid"><div>'+holds+'</div><div>'+alloc+ls+sec+'</div></div>';
  }

  // ---- compare chart (overlay selected funds, rebased to 100, vs NIFTY 50) ----
  const CMP_PAL=['#5b5bf0','#0e9aa7','#d9820b','#12a150','#e5484d','#8b5cf6','#c026d3','#0891b2','#65a30d','#db2777'];
  function updateCompareBtn(){ const n=compareSet.size; $('#cmpN').textContent='('+n+')';
    $('#compare').classList.toggle('pri', n>0);
    const f=$('#cmpFloat'); if(f){ $('#cmpFloatN').textContent=n; f.classList.toggle('on', n>0); } }
  function openCompare(){ $('#cmp').classList.add('on'); renderCompare(); }
  function closeCompare(){ $('#cmp').classList.remove('on'); }
  function renderCompare(){
    const body=$('#cmpBody'); if(!DATA){ body.innerHTML=''; return; }
    const from=$('#from').value,to=$('#to').value;
    const D=+$('#days').value||252, Rf=+$('#rf').value||0, recoveryMode=$('#recmode').value;
    $('#cmpSub').textContent = from+' → '+to+' · NAV rebased to 100 · vs '+BENCHNAME;
    const codes=[...compareSet];
    if(!codes.length){ body.innerHTML='<div class="cmp-empty">Tick the checkbox on any fund rows, then reopen Compare — overlay as many as you like against '+esc(BENCHNAME)+'. Lines are each fund’s NAV rebased to 100 at the start of your date window.</div>'; return; }
    const items=[];
    codes.forEach((code,i)=>{ const s=DATA.schemes.find(x=>x.code===code); if(!s) return;
      const w=M.windowSeries(s.series, from, to); if(w.length<2) return;
      const m=M.compute(w,{D,Rf,recoveryMode}); Object.assign(m,M.captureRatios(w,BENCH));
      Object.assign(m,M.periodReturns(s.series, to||(s.series.length?s.series[s.series.length-1][0]:null)));
      items.push({code,name:s.name,sif:s.sif,color:CMP_PAL[i%CMP_PAL.length],w,m}); });
    let bench=null;
    if(BENCH){ const bw=Object.keys(BENCH).filter(d=>(!from||d>=from)&&(!to||d<=to)).sort().map(d=>[d,BENCH[d]]);
      if(bw.length>1) bench={name:BENCHNAME,sif:BENCHNAME,color:'#94a3b8',w:bw,isBench:true}; }
    const lines=items.concat(bench?[bench]:[]);
    if(!lines.length){ body.innerHTML='<div class="cmp-empty">No data for the selected funds in this window.</div>'; return; }
    let dmin=null,dmax=null;
    lines.forEach(L=>{ const a=L.w[0][0],b=L.w[L.w.length-1][0]; if(!dmin||a<dmin)dmin=a; if(!dmax||b>dmax)dmax=b; });
    const span=Math.max(1,M.daysBetween(dmin,dmax));
    const W=940,H=360,P=34; let vmin=1e9,vmax=-1e9;
    lines.forEach(L=>{ const base=L.w[0][1]; L.pts=L.w.map(p=>[M.daysBetween(dmin,p[0])/span,(p[1]/base)*100]);
      L.pts.forEach(q=>{ if(q[1]<vmin)vmin=q[1]; if(q[1]>vmax)vmax=q[1]; }); });
    const geo={L:52,R:16,T:12,B:34,W:960,H:380};
    const yt=niceTicks(vmin,vmax,6), xticks=xTimeTicks(dmin,span,6);
    const ax=axisSVG(geo,yt,x=>x.toFixed(0),xticks,'NAV (rebased to 100)','Date');
    let svg='<svg width="100%" viewBox="0 0 '+geo.W+' '+geo.H+'" style="max-height:58vh">'+ax.svg;
    svg+='<line x1="'+geo.L+'" x2="'+(geo.W-geo.R)+'" y1="'+ax.mapY(100).toFixed(1)+'" y2="'+ax.mapY(100).toFixed(1)+'" stroke="var(--accent2)" stroke-dasharray="4 3" opacity="0.65"/>';
    lines.forEach(L=>{ let d=''; L.pts.forEach((q,i)=>{ d+=(i?'L':'M')+ax.mapX(q[0]).toFixed(1)+' '+ax.mapY(q[1]).toFixed(1)+' '; });
      svg+='<path d="'+d+'" fill="none" stroke="'+L.color+'" stroke-width="'+(L.isBench?1.3:1.8)+'"'+(L.isBench?' stroke-dasharray="5 4"':'')+'/>'; });
    svg+='</svg>';
    const legend='<div class="cmp-legend">'+lines.map(L=>'<span class="lg"><span class="sw2" style="background:'+L.color+'"></span>'+
      esc(L.sif)+(L.isBench?'':' <span class="sub">'+esc(splitName(L.name).plan||'')+'</span>')+'</span>').join('')+'</div>';
    const g=x=>x==null||!isFinite(x)?'—':(Math.abs(x)>=100?x.toFixed(0):x.toFixed(2));
    // full timeframe × metric comparison matrix (funds = rows)
    const CMPCOLS=[['r1d','1D %'],['r1w','1W %'],['rwtd','WTD %'],['rmtd','MTD %'],['r1m','1M %'],
      ['r3m','3M %'],['r6m','6M %'],['rytd','YTD %'],['rfytd','FYTD %'],['totalRet','Total %'],
      ['annStd','Ann Std %'],['sharpe','Sharpe'],['sortino','Sortino'],
      ['maxDD','Max DD %'],['upCapture','Up Cap'],['downCapture','Dn Cap']];
    let tbl='<div class="cmpt-wrap"><table class="cmpt"><thead><tr><th>Fund</th>'+
      CMPCOLS.map(c=>'<th>'+c[1]+'</th>').join('')+'</tr></thead><tbody>';
    items.forEach(L=>{ const m=L.m;
      tbl+='<tr><td><span class="sw2" style="background:'+L.color+';display:inline-block;width:12px;margin-right:6px"></span>'+
        esc(L.sif)+' <span class="sub">'+esc(splitName(L.name).plan||'')+'</span></td>'+
        CMPCOLS.map(c=>'<td class="num">'+g(m[c[0]])+'</td>').join('')+'</tr>'; });
    tbl+='</tbody></table></div>';
    body.innerHTML='<div class="cmp-note sub">NAV rebased to 100 vs '+esc(BENCHNAME)+
      '. Table compares each fund across timeframes &amp; risk metrics for the current window.</div>'+svg+legend+tbl;
  }

  // ---- helpers ----
  function esc(s){ return (''+s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function shortD(iso){ if(!iso)return''; const p=iso.split('-'); return p[2]+MON[+p[1]-1]; }

  // ---- data quality scan (on load / on new data) ----
  function scanQC(data){
    let jumps=0,dupes=0,minD='9999',maxD='0000';
    data.schemes.forEach(s=>{
      const seen=new Set(); let prev=null;
      s.series.forEach(([d,nav])=>{
        if(seen.has(d)) dupes++; seen.add(d);
        if(d<minD)minD=d; if(d>maxD)maxD=d;
        if(prev!=null && prev>0){ if(Math.abs(nav/prev-1)>0.10) jumps++; }
        prev=nav;
      });
    });
    data.qc={jumps,dupes}; data.dataFrom=minD==='9999'?'—':minD; data.dataTo=maxD==='0000'?'—':maxD;
  }

  // ---- CSV export ----
  function exportCSV(){
    const cols=['group','sif','parent','name','code','isin','rangeFrom','rangeTo','obs',
      'ret1d','ret1w','retMTD','ret1m','ret2m','ret3m','ret6m','retYTD','retFYTD','totalRet','avgDaily',
      'annRet','annStd','sharpe','sortino','calmar','maxDD','maxRU','recovery','recovered',
      'winRate','gainPain','upCapture','downCapture','cagr'];
    const lines=[cols.join(',')];
    ROWS.forEach(r=>{ const m=r.m; const pm=amcMetaFor(r.sif);
      const row=[r.group.label,r.sif,(pm&&pm.parent)||'',r.name,r.code,r.isin,m.rangeFrom,m.rangeTo,m.obs,
        f(m.r1d),f(m.r1w),f(m.rmtd),f(m.r1m),f(m.r2m),f(m.r3m),f(m.r6m),f(m.rytd),f(m.rfytd),f(m.totalRet),f(m.avgDaily),
        f(m.annRet),f(m.annStd),f(m.sharpe),f(m.sortino),f(m.calmar),f(m.maxDD),f(m.maxRU),
        (m.maxDD<=0?'':m.recovery),m.recovered,f(m.winRate),f(m.gainPain),f(m.upCapture),f(m.downCapture),f(m.cagr)]
        .map(x=>{ x=(x==null?'':''+x); return /[",\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x; });
      lines.push(row.join(','));
    });
    function f(v){ return (v==null||!isFinite(v))?'':(+v).toFixed(4); }
    const blob=new Blob([lines.join('\n')],{type:'text/csv'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download='sif_metrics_'+$('#from').value+'_'+$('#to').value+'.csv'; a.click();
  }

  // ---- raw AMFI file parsing (drag-drop) — map columns BY HEADER NAME ----
  function parseAMFI(text){
    const lines=text.split(/\r?\n/);
    let hdr=-1, delim=';';
    for(let i=0;i<lines.length;i++){
      const L=lines[i];
      if(/scheme name/i.test(L) && /net asset value/i.test(L) && /date/i.test(L)){
        hdr=i; delim = L.indexOf(';')>=0?';':(L.indexOf('\t')>=0?'\t':';'); break;
      }
    }
    if(hdr<0) throw new Error('No AMFI header row (need Scheme Name / Net Asset Value / Date).');
    const cols=lines[hdr].split(delim).map(s=>s.trim().toLowerCase());
    const idx=(...names)=>{ for(const nm of names){ const k=cols.findIndex(c=>c.includes(nm)); if(k>=0)return k; } return -1; };
    const iName=idx('scheme name'), iNav=idx('net asset value'), iDate=idx('date'),
          iCode=idx('scheme code'), iIsin=idx('isin div payout','isin growth','isin');
    const map=new Map();
    for(let i=hdr+1;i<lines.length;i++){
      const L=lines[i]; if(!L || L.indexOf(delim)<0) continue;
      const f=L.split(delim); if(f.length<=Math.max(iName,iNav,iDate)) continue;
      const name=(f[iName]||'').trim(); const navs=(f[iNav]||'').trim(); const ds=(f[iDate]||'').trim();
      if(!name||!navs||!ds) continue;
      const nav=parseFloat(navs); if(!isFinite(nav)) continue;
      const iso=toISO(ds); if(!iso) continue;
      const code=iCode>=0?(f[iCode]||'').trim():name;
      const key=code||name;
      if(!map.has(key)) map.set(key,{code:code||name,name,cat:name,sif:name.split(' - ')[0],
        isin:iIsin>=0?(f[iIsin]||'').trim():'', series:[]});
      map.get(key).series.push([iso,nav]);
    }
    const schemes=[...map.values()].map(s=>{
      const seen=new Map(); s.series.forEach(([d,n])=>seen.set(d,n));
      s.series=[...seen.entries()].sort((a,b)=>a[0]<b[0]?-1:1);
      return s;
    });
    return {generated:new Date().toISOString(), source:'drag-drop AMFI file', schemes};
  }
  function toISO(s){
    s=s.trim(); if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10);
    const m=s.match(/^(\d{1,2})[-\/ ]([A-Za-z]{3})[-\/ ](\d{4})$/);
    if(m){ const mi=MON.indexOf(m[2][0].toUpperCase()+m[2].slice(1,3).toLowerCase()); if(mi<0)return null;
      return m[3]+'-'+String(mi+1).padStart(2,'0')+'-'+m[1].padStart(2,'0'); }
    return null;
  }

  // ---- load ----
  function ingest(data, note){
    scanQC(data);
    DATA=data;
    // default window = full data extent (clamped)
    if(!$('#from').value){ $('#from').value=data.dataFrom; }
    if(!$('#to').value){ $('#to').value=data.dataTo; }
    $('#fnote').textContent=note||('source: '+(data.source||'nav_data.json'));
    const nt=$('#navtill');
    if(nt) nt.innerHTML='NAVs updated till <b>'+(data.dataTo? niceDate(data.dataTo):'—')+'</b>';
    recompute();
  }
  function niceDate(iso){ if(!iso||iso.length<10) return iso||'—'; const p=iso.split('-');
    return p[2]+' '+MON[+p[1]-1]+' '+p[0]; }
  // live clock (top-left) — updates every second so it's obvious the page isn't cached
  function tickClock(){ const el=$('#liveclock'); if(!el) return;
    const s=new Date().toLocaleString('en-IN',{weekday:'short',day:'2-digit',month:'short',
      year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true});
    el.innerHTML='<span class="livedot"></span> Live · '+s; }
  tickClock(); setInterval(tickClock, 1000);
  function loadJSON(tries){
    tries = tries||0;
    fetch('nav_data.json',{cache:'no-store'}).then(r=>{ if(!r.ok)throw new Error(r.status); return r.json(); })
      .then(d=>ingest(d))
      .catch(e=>{
        if(tries<3){ setTimeout(()=>loadJSON(tries+1), 350); return; }  // self-heal transient reset
        $('#dot').className='dot err';
        $('#stat').innerHTML='could not load nav_data.json ('+e.message+
          ') — run <code>python fetch_amfi_sif.py --serve</code> then open via http://127.0.0.1:8765/sif_dashboard.html, or drag a raw AMFI file here.';
      });
  }
  function loadBenchmark(){
    fetch('benchmark_data.json',{cache:'no-store'}).then(r=>{ if(!r.ok)throw new Error(r.status); return r.json(); })
      .then(d=>{ BENCH={}; (d.series||[]).forEach(p=>BENCH[p[0]]=p[1]); BENCHNAME=d.index||'NIFTY 50';
        if(DATA) recompute(); })
      .catch(()=>{ BENCH=null; });
  }
  function loadPortfolios(){
    // optional: the page works fully without it. Refresh open rows once it arrives.
    fetch('portfolios/index.json',{cache:'no-store'}).then(r=>{ if(!r.ok)throw new Error(r.status); return r.json(); })
      .then(idx=>{ PORT=idx; _sifMeta=null; if(DATA) render(); })   // re-render so rows pick up parent AMC + badge
      .catch(()=>{ PORT={schemes:{},amcs:{},periods:[]}; });
  }
  function doFetch(){
    // Optional proxy base: open the page as ...?api=https://your-worker.example.com to make
    // the button work on static hosting. Defaults to the local --serve endpoint.
    const base = new URLSearchParams(location.search).get('api') || '';
    const from=$('#from').value, to=$('#to').value;
    $('#dot').className='dot warn'; $('#stat').textContent='fetching from AMFI…';
    fetch(base+'/refresh?from='+from+'&to='+to,{cache:'no-store'})
      .then(r=>{ if(!r.ok)throw new Error(r.status); return r.json(); })
      .then(d=>{ if(d.error)throw new Error(d.error); ingest(d,'refreshed from AMFI '+new Date().toLocaleTimeString()); })
      .catch(e=>{ $('#dot').className='dot err';
        $('#stat').innerHTML='live fetch failed ('+e.message+') — it needs the local Python server '+
          '(<code>python fetch_amfi_sif.py --serve</code>) or a proxy. On the hosted site the data auto-refreshes daily.'; });
  }

  // ---- wire up ----
  // theme toggle (persisted; a tiny <head> script applies the saved theme before first paint)
  function setTheme(t){
    if(t==='dark') document.documentElement.setAttribute('data-theme','dark');
    else document.documentElement.removeAttribute('data-theme');
    $('#theme').textContent = (t==='dark'?'☀ Theme':'☾ Theme');
    try{ localStorage.setItem('sif-theme', t); }catch(e){}
    if(DATA) render();   // re-tint bands for the active theme
  }
  let _theme='light'; try{ _theme=localStorage.getItem('sif-theme')||'light'; }catch(e){}
  setTheme(_theme);
  $('#theme').onclick=()=>setTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');

  // mobile: filters collapse by default (data-first)
  const _mq=window.matchMedia('(max-width:820px)');
  function applyMobile(){ document.querySelector('header').classList.toggle('collapsed', _mq.matches); }
  applyMobile(); try{ _mq.addEventListener('change',applyMobile); }catch(e){ _mq.addListener(applyMobile); }
  $('#filtToggle').onclick=()=>{ const h=document.querySelector('header');
    const c=h.classList.toggle('collapsed'); $('#filtToggle').setAttribute('aria-expanded',(!c).toString()); };

  // ---- Columns picker: choose which metric/timeframe columns to compare ----
  const CPRESETS={ returns:['r1d','r1w','rwtd','rmtd','r1m','r3m','r6m','rytd','rfytd','totalRet'],
                   risk:['sharpe','sortino','calmar','maxDD','downCapture','upCapture'] };
  function pickable(){ return COLS.filter(c=>c.k!=='name'&&c.k!=='uw'); }
  function updateColSum(){ const shown=pickable().filter(c=>!hiddenCols.has(c.k)).length;
    const s=$('#colsum'); if(s) s.textContent='Columns ('+shown+') ▾'; }
  function buildColMenu(){
    const menu=$('#colmenu'); if(!menu) return;
    const presets='<div class="cprow"><button data-preset="returns">Returns</button>'+
      '<button data-preset="risk">Risk</button><button data-preset="all">All</button></div>';
    menu.innerHTML=presets+pickable().map(c=>'<label class="copt"><input type="checkbox" data-col="'+c.k+'"'+
      (hiddenCols.has(c.k)?'':' checked')+'>'+esc(c.label)+'</label>').join('');
    menu.querySelectorAll('input[data-col]').forEach(cb=>cb.onchange=()=>{
      const k=cb.getAttribute('data-col'); if(cb.checked) hiddenCols.delete(k); else hiddenCols.add(k);
      render(); updateColSum(); });
    menu.querySelectorAll('button[data-preset]').forEach(b=>b.onclick=e=>{ e.preventDefault();
      const p=b.getAttribute('data-preset');
      if(p==='all') hiddenCols=new Set();
      else { const keep=new Set(CPRESETS[p]); hiddenCols=new Set(pickable().filter(c=>!keep.has(c.k)).map(c=>c.k)); }
      buildColMenu(); render(); updateColSum(); });
  }
  if(_mq.matches) hiddenCols=new Set(MOBILE_HIDE);   // phones start on a readable, comparison-ready set
  buildColMenu(); updateColSum();

  $('#recompute').onclick=recompute;
  $('#csv').onclick=exportCSV;
  $('#compare').onclick=openCompare;
  $('#cmpFloat').onclick=openCompare;
  $('#cmpClose').onclick=closeCompare;
  $('#cmpClear').onclick=()=>{ compareSet.clear(); updateCompareBtn(); render(); renderCompare(); };
  $('#cmp').addEventListener('click',e=>{ if(e.target.id==='cmp') closeCompare(); });
  window.addEventListener('keydown',e=>{ if(e.key==='Escape') closeCompare(); });
  $('#fetch').onclick=doFetch;
  $('#maxrange').onclick=()=>{ if(DATA){ $('#from').value=DATA.dataFrom; $('#to').value=DATA.dataTo; recompute(); } };
  ['from','to','rf','days','minobs','recmode','strat','plan','opt','myrx','search'].forEach(id=>{
    const el=document.getElementById(id);
    el.addEventListener('change',recompute);
    if(el.type!=='date'&&el.tagName!=='SELECT') el.addEventListener('keydown',e=>{ if(e.key==='Enter')recompute(); });
  });

  // drag-drop
  const dz=$('#drop');
  window.addEventListener('dragover',e=>{e.preventDefault(); dz.classList.add('on');});
  dz.addEventListener('dragleave',e=>{ if(e.target===dz) dz.classList.remove('on'); });
  window.addEventListener('drop',e=>{
    e.preventDefault(); dz.classList.remove('on');
    const f=e.dataTransfer.files[0]; if(!f)return;
    const rd=new FileReader();
    rd.onload=()=>{ try{
        const txt=rd.result;
        const data = txt.trim().startsWith('{') ? JSON.parse(txt) : parseAMFI(txt);
        $('#from').value=''; $('#to').value='';
        ingest(data,'loaded '+f.name+' · '+data.schemes.length+' schemes');
      }catch(err){ $('#dot').className='dot err'; $('#stat').textContent='parse failed: '+err.message; }
    };
    rd.readAsText(f);
  });

  loadJSON();
  loadPortfolios();
  loadBenchmark();
})();
</script>
