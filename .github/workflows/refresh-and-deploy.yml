name: Refresh AMFI SIF data

# Fetches real NAVs (daily) and, monthly, the fund-house PORTFOLIO disclosures, then commits both
# back into the repo (so the data is versioned/"saved on the repo"). Deployment is handled by
# Cloudflare Pages, which is Git-connected and auto-publishes every push to main (including the
# data commits below) — so this workflow only has to refresh data. THIS folder is the repo root.

on:
  schedule:
    # AMFI publishes SIF NAVs in the evening IST — fetch a few times so late-published NAVs are
    # caught the same day, with a next-morning backfill as a safety net. Each run is idempotent
    # (fetches the full range, commits only if the data actually changed).
    - cron: '30 14 * * 1-5'   # 20:00 IST Mon-Fri
    - cron: '30 17 * * 1-5'   # 23:00 IST Mon-Fri (catches late-evening publication)
    - cron: '30 2 * * 2-6'    # 08:00 IST Tue-Sat (backfill the previous trading day)
    # Portfolio disclosures: WEEKLY, not monthly. SIF houses file on a staggered, roughly bi-monthly
    # cycle and not on the same month as each other (verified: 2026-05 and 2026-06 share no funds at
    # all), so a fixed monthly date silently misses whoever published just after it. Polling every
    # Monday picks each disclosure up within a week of publication, whatever month it lands in; the
    # fetcher stamps each file with its own disclosure period, so months stay correctly aligned.
    - cron: '0 15 * * 1'
  workflow_dispatch:            # trigger a refresh manually from the Actions tab
    inputs:
      from:
        description: 'NAV start date (YYYY-MM-DD)'
        default: '2025-10-01'
      portfolios:
        description: 'Also refresh portfolio disclosures?'
        type: boolean
        default: true
  push:
    branches: [ main ]          # re-run monitor/checks whenever you push changes

permissions:
  contents: write               # commit refreshed nav_data.json + portfolios/ back to main
  issues: write                 # open an alert issue when the monitor detects changes

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch real NAVs from AMFI
        # If AMFI blocks the CI runner, the job keeps the last committed nav_data.json.
        run: |
          python fetch_amfi_sif.py \
            --from "${{ github.event.inputs.from || '2025-10-01' }}" \
            --to "$(date -u +%F)" \
            --out nav_data.json \
          || echo "::warning::AMFI NAV fetch failed — keeping last committed nav_data.json"

      - name: Fetch NIFTY 50 benchmark (for up/down capture)
        run: |
          python fetch_benchmark.py --to "$(date -u +%F)" \
          || echo "::warning::benchmark fetch failed — keeping last committed benchmark_data.json"

      - name: Fetch portfolio disclosures (weekly cron or manual)
        # Skipped on the daily NAV crons and on plain pushes, so portfolios refresh weekly.
        if: ${{ github.event.schedule == '0 15 * * 1' || (github.event_name == 'workflow_dispatch' && github.event.inputs.portfolios != 'false') }}
        run: |
          pip install -r requirements.txt
          python fetch_sif_portfolios.py \
          || echo "::warning::Portfolio fetch failed — keeping last committed portfolios/"

      - name: Fetch AMFI official SIF monthly industry reports
        # The authoritative industry AUM / folios / flows series, one whole-industry snapshot per
        # month since the category launched. Cheap and idempotent: months already fetched are simply
        # re-read, and AMFI publishes the new month a week or two after month end.
        run: |
          pip install -r requirements.txt
          python fetch_amfi_monthly.py --out industry_data.json \
          || echo "::warning::AMFI monthly fetch failed — keeping last committed industry_data.json"

      - name: Track SIF new fund offers
        # AMFI's NFO list is a dateless snapshot with no archive, so the history only exists if we
        # record it. Runs on every job — a missed day just widens one offer's observed window.
        run: |
          python fetch_sif_nfo.py --out nfo_data.json \
          || echo "::warning::NFO fetch failed — keeping last committed nfo_data.json"

      - name: Rebuild AUM / market-share aggregates
        # Derived purely from the committed portfolio files, so it is cheap and always safe to run.
        run: |
          python build_aum.py \
          || echo "::warning::AUM aggregation failed — keeping last committed aum_data.json"

      - name: Snapshot world financial news (fallback copy only)
        # The LIVE /news page is served by the Cloudflare Pages Function functions/api/news.js,
        # which re-aggregates the same feeds at the edge every 30 minutes. This step only refreshes
        # the committed fallback snapshot — deliberately NOT every 30 min, because every commit
        # triggers a Pages build and the free plan allows 500 builds/month.
        run: |
          python fetch_news.py --out news_data.json \
          || echo "::warning::news fetch failed — keeping last committed news_data.json"

      - name: Daily change monitor (new funds · disclosures · manager changes · dead links)
        run: python monitor.py || echo "::warning::monitor failed"

      - name: Commit refreshed data back to the repo
        # Best-effort: a data-push race must never fail the job. The push itself triggers the
        # Cloudflare Pages deploy, so fresh data is live within ~a minute of this commit.
        continue-on-error: true
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nav_data.json benchmark_data.json news_data.json nfo_data.json aum_data.json industry_data.json portfolios/ monitor/state.json monitor/CHANGELOG.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            # NOTE: do NOT put [skip ci] here — Cloudflare Pages honors it and would skip the deploy,
            # so the site would never update from data commits. A GITHUB_TOKEN push does not re-trigger
            # this workflow anyway (GitHub blocks recursive workflow runs), so there is no CI loop.
            git commit -m "data: refresh NAVs / portfolios"
            git pull --rebase --autostash origin main || true
            git push || echo "::warning::data commit push failed — will retry next run"
          fi

      - name: Alert on detected changes (opens a GitHub issue → emails you)
        if: ${{ hashFiles('monitor/changed.flag') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "SIF change alert — $(date -u +%F)" \
            --body-file monitor/changed.flag \
          || echo "::warning::could not open alert issue"
